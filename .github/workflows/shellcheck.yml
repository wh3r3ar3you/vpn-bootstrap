name: Проверка shell-скриптов

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Установка ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Проверка синтаксиса Bash
        run: bash -n bootstrap.sh install.sh scripts/update-traffic-guard.sh scripts/apply-vpn-network-tuning.sh tests/network-tuning-detection.sh

      - name: Проверка ShellCheck
        run: shellcheck bootstrap.sh install.sh scripts/update-traffic-guard.sh scripts/apply-vpn-network-tuning.sh tests/network-tuning-detection.sh

      - name: Проверка автоопределения virtio
        run: tests/network-tuning-detection.sh
